<body>
  <header class="site-header"><div class="wrap header-inner">
    <div class="brand"><div class="brand-mark"><span>¡</span></div><div>Hola!<small>Španělština • Lekce 1–4</small></div></div>
    <nav aria-label="Hlavní navigace">
      <button type="button" data-tab="home" aria-current="page">Učit se</button>
      <button type="button" data-tab="progress">Pokrok</button>
      <button type="button" data-tab="words">Slovíčka</button>
    </nav>
  </div></header>
  <main id="app" class="wrap main" tabindex="-1"></main>
  <div id="toast" role="status" aria-live="polite" class="toast"></div>
  <script src="./words-extra.js"></script>
  <script>
    'use strict';
    // Údaje jsou přepsány z fotografie slovníčku první lekce.
    const LESSON1 = [
      {id:'como-estas',es:'¿Cómo estás?',cs:'Jak se máš?'},
      {id:'que-tal',es:'¿Qué tal?',cs:'Jak se vede?'},
      {id:'adios',es:'adiós',cs:'sbohem, na shledanou'},
      {id:'buenas-noches',es:'buenas noches',cs:'dobrou noc'},
      {id:'buenas-tardes',es:'buenas tardes',cs:'dobrý večer'},
      {id:'buenos-dias',es:'buenos días',cs:'dobrý den'},
      {id:'encantado-a',es:'encantado/a',cs:'těší mě'},
      {id:'gracias',es:'gracias',cs:'děkuji'},
      {id:'hasta-luego',es:'hasta luego',cs:'na shledanou'},
      {id:'hasta-manana',es:'hasta mañana',cs:'na shledanou zítra'},
      {id:'hasta-otro-dia',es:'hasta otro día',cs:'někdy na shledanou'},
      {id:'hasta-pronto',es:'hasta pronto',cs:'brzy na shledanou'},
      {id:'hola',es:'hola',cs:'ahoj'},
      {id:'muchas-gracias',es:'muchas gracias',cs:'díky moc'},
      {id:'mucho-gusto',es:'mucho gusto',cs:'těší mě'},
      {id:'muy-bien',es:'muy bien',cs:'velmi dobře'},
      {id:'si',es:'sí',cs:'ano'},
      {id:'no',es:'no',cs:'ne'},
      {id:'llamarse',es:'llamarse',cs:'jmenovat se'},
      {id:'ser',es:'ser',cs:'být'}
    ];
    LESSON1.forEach(w=>w.lesson=1);
    const LESSONS=[{number:1,title:'Hola, ¿qué tal?',partial:false,words:LESSON1},...(window.SPANISH_EXTRA_LESSONS||[])];
    const ALL_WORDS=LESSONS.flatMap(l=>l.words);
    let selectedLesson='1', WORDS=LESSON1;
    const KEY = 'spanelstina-hola-lekce-1-progress-v1';
    const INTERVALS = [0,1,3,7,14,30];
    const DAY = 86400000;
    const GOAL = 10;
    const INITIAL = {version:1,direction:'cs-es',cards:{},daily:{}};
    const deepCopy = x => JSON.parse(JSON.stringify(x));
    const html = s => String(s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
    function getLocalDay(date=new Date()){return [date.getFullYear(),String(date.getMonth()+1).padStart(2,'0'),String(date.getDate()).padStart(2,'0')].join('-')}
    function parseState(s){try{const x=JSON.parse(s);if(x?.version===1 && x.cards && typeof x.cards==='object' && !Array.isArray(x.cards) && x.daily && typeof x.daily==='object' && !Array.isArray(x.daily))return {...deepCopy(INITIAL),...x,direction:x.direction==='es-cs'?'es-cs':'cs-es'}}catch(e){} return deepCopy(INITIAL)}
    let canSave=true;
    let state;
    try {const saved=localStorage.getItem(KEY);state=saved?parseState(saved):deepCopy(INITIAL);localStorage.setItem(KEY,JSON.stringify(state))} catch(e) {state=deepCopy(INITIAL);canSave=false}
    selectedLesson=(String(state.selectedLesson)==='all'||LESSONS.some(l=>String(l.number)===String(state.selectedLesson)))?String(state.selectedLesson):'1';
    WORDS=selectedLesson==='all'?ALL_WORDS:LESSONS[Number(selectedLesson)-1].words;
    let tab='home',mode='due',session=null,query='',wordFilter='all';
    const root=document.getElementById('app');
    function persist(){try{localStorage.setItem(KEY,JSON.stringify(state));canSave=true}catch(e){canSave=false;showToast('Prohlížeč nyní neumožňuje uložit data. Použijte export zálohy.')}}
    function showToast(message){let t=document.getElementById('toast');t.textContent=message;t.classList.add('show');clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>t.classList.remove('show'),3300)}
    function rawCard(word,dir=state.direction){return state.cards[word.id+'|'+dir]||{level:0,streak:0,right:0,wrong:0,seen:0,due:0,last:0}}
    function cardStatus(word){const c=rawCard(word);return !c.seen?'new':c.level>=3?'mastered':'learning'}
    function isDue(word){const c=rawCard(word);return !c.seen || !c.due || c.due<=Date.now()}
    function counts(){let mastered=0,learning=0,newCount=0,due=0;for(const w of WORDS){let s=cardStatus(w);if(s==='new')newCount++;if(s==='learning')learning++;if(s==='mastered')mastered++;if(isDue(w))due++}return {mastered,learning,newCount,due}}
    function today(){return state.daily[getLocalDay()]||{attempts:0,correct:0}}

    function statsHtml(){const c=counts();return `<section class="stats" aria-label="Přehled pokroku">

    function home(){if(session)return sessionHtml();const t=today();const c=counts();return `${commonHeader()}

      <aside><section class="panel"><h3>Dnešní cíl</h3><div class="goal-top"><strong>${Math.min(t.attempts,GOAL)} / ${GOAL}</strong><span>odpovědí</span></div><div class="progress-track"><div class="progress-fill" style="width:${Math.min(100,t.attempts/GOAL*100)}%"></div></div>

    function createQueue(chosenMode){if(chosenMode==='all')return shuffle(WORDS.map(w=>w.id));if(chosenMode==='hard')return shuffle(WORDS.filter(w=>rawCard(w).wrong>0).map(w=>w.id));return shuffle(WORDS.filter(isDue).map(w=>w.id)).slice(0,15)}
    function startSession(chosenMode=mode,ids=null){const queue=ids?[...ids]:createQueue(chosenMode);if(!queue.length){showToast(chosenMode==='due'?'Všechna dnešní opakování jsou hotová. Zkuste „Všechna slovíčka“.':'V tomto výběru zatím nejsou žádná slovíčka.');return}tab='home';session={queue,index:0,known:0,missed:0,revealed:false,done:false,seenInSession:{},direction:state.direction};window.scrollTo({top:0,behavior:'smooth'});render()}
    function sessionHtml(){if(session.done)return finishHtml();const word=WORDS.find(w=>w.id===session.queue[session.index]);if(!word){session.done=true;return finishHtml()}const forward=session.direction==='cs-es';const source=forward?word.cs:word.es;const target=forward?word.es:word.cs;
      return `<div class="section-head"><div>${commonHeader()}<h1 style="font-size:clamp(27px,4vw,38px)">Procvičujeme</h1><p class="subtle">${forward?'Z češtiny do španělštiny':'Ze španělštiny do češtiny'}</p></div><button type="button" class="text-btn" id="end">Ukončit lekci</button></div>

      <button id="flashcard" type="button" class="flashcard ${session.revealed?'revealed':''}" aria-label="${session.revealed?'Správná odpověď: '+html(target):'Přeložte: '+html(source)+'. Kliknutím zobrazit odpověď.'}">
      <span class="card-type">${session.revealed?(forward?'Español':'Česky'):(forward?'Česky':'Español')}</span>
      <span class="card-term">${html(session.revealed?target:source)}</span>
      <span class="card-hint">${session.revealed?'Zhodnoťte, zda jste odpověď znali':'Kliknutím otočíte kartičku'}</span></button>

    function finishHtml(){return `<section class="panel session-finish" style="max-width:680px;margin:25px auto"><div class="medal" aria-hidden="true">✦</div><div class="eyebrow" style="justify-content:center">HOTOVO</div><h2>¡Muy bien!</h2><p>Procvičování dokončeno. Slovíčka, která zatím nejdou, se znovu objeví při dalším opakování.</p>

    function rate(known){if(!session||session.done||!session.revealed)return;const id=session.queue[session.index];const k=id+'|'+session.direction;const previous=state.cards[k]||{level:0,streak:0,right:0,wrong:0,seen:0,due:0,last:0};const c={...previous};c.seen=(Number(c.seen)||0)+1;c.last=Date.now();if(known){c.right=(Number(c.right)||0)+1;c.streak=(Number(c.streak)||0)+1;c.level=Math.min(5,(Number(c.level)||0)+1);c.due=Date.now()+INTERVALS[c.level]*DAY;session.known++}else{c.wrong=(Number(c.wrong)||0)+1;c.streak=0;c.level=0;c.due=Date.now();session.missed++;session.seenInSession[id]=(session.seenInSession[id]||0)+1;if(session.seenInSession[id]<=1)session.queue.push(id)}state.cards[k]=c;const d=getLocalDay();state.daily[d]=state.daily[d]||{attempts:0,correct:0};state.daily[d].attempts++;if(known)state.daily[d].correct++;persist();session.index++;session.revealed=false;if(session.index>=session.queue.length)session.done=true;render()}
    // Safari/iOS: choose an actual Spanish voice, retain utterance and surface playback errors.
    let liveUtterance=null;
    function spanishVoices(){if(!('speechSynthesis' in window))return [];return window.speechSynthesis.getVoices().filter(v=>/^es([_-]|$)/i.test(v.lang||''))}
    function spokenText(input){return input.replace(/el\/la\s+/gi,'el ').replace(/\/a\b/g,'').replace(/[¿?¡!]/g,'').trim()}
    function playSpanish(input){
      if(!('speechSynthesis' in window)||!('SpeechSynthesisUtterance' in window)){showToast('Prohlížeč nepodporuje hlasové čtení.');return}
      try{
        const synth=window.speechSynthesis, voices=spanishVoices();
        const voice=voices.find(v=>v.lang.toLowerCase()==='es-es'&&v.localService)||voices.find(v=>v.lang.toLowerCase()==='es-es')||voices[0];
        if(synth.speaking||synth.pending)synth.cancel();
        if(synth.paused)synth.resume();
        const speech=new SpeechSynthesisUtterance(spokenText(input));
        speech.lang=voice?.lang||'es-ES';if(voice)speech.voice=voice;
        speech.rate=.88;speech.pitch=1;speech.volume=1;
        liveUtterance=speech;
        const status=()=>document.getElementById('audio-status');
        speech.onstart=()=>{if(status())status().textContent='Přehrávání spuštěno'+(voice?' · '+voice.name:'')+'.'};
        speech.onend=()=>{if(liveUtterance===speech)liveUtterance=null;if(status())status().textContent=''};
        speech.onerror=e=>{if(liveUtterance===speech)liveUtterance=null;if(e.error!=='interrupted'&&e.error!=='canceled')showToast('Zvuk se nepodařilo přehrát ('+(e.error||'chyba')+'). Zkontrolujte hlasitost a španělský hlas v nastavení zařízení.')};
        synth.speak(speech);
        if(!voice)showToast('Systém nenabízí španělský hlas. Přidejte v nastavení hlas Español a zkuste to znovu.');
      }catch(e){showToast('Chyba přehrávání: '+e.message)}
    }
    function speak(){if(!session||session.done)return;const w=WORDS.find(x=>x.id===session.queue[session.index]);if(w)playSpanish(w.es)}
    if('speechSynthesis' in window)try{window.speechSynthesis.getVoices();window.speechSynthesis.addEventListener?.('voiceschanged',()=>window.speechSynthesis.getVoices())}catch(e){}
    function progress(){const c=counts();const t=today();const all=WORDS.map(rawCard);const successes=all.reduce((sum,x)=>sum+(Number(x.right)||0),0);const errors=all.reduce((sum,x)=>sum+(Number(x.wrong)||0),0);const pct=successes+errors?Math.round(successes/(successes+errors)*100):0;const days=Array.from({length:7},(_,i)=>{const x=new Date();x.setHours(12,0,0,0);x.setDate(x.getDate()-(6-i));return {date:getLocalDay(x),label:x.toLocaleDateString('cs-CZ',{weekday:'short'}),value:(state.daily[getLocalDay(x)]||{attempts:0}).attempts}});const max=Math.max(10,...days.map(x=>x.value));return `${commonHeader()}<div class="section-head"><div><h1>Tvůj pokrok</h1><p class="lead">Jak postupuje učení a co je právě potřeba zopakovat.</p></div></div>${lessonPicker()}${statsHtml()}
      <div class="progress-layout"><section class="panel"><h2>Aktivita za posledních 7 dní</h2><p class="subtle">Počet vyhodnocených kartiček za den, oba směry překladu dohromady.</p><div class="bars">${days.map(x=>`<div class="barcol"><span class="bar-num">${x.value||''}</span><div class="bar-track"><div class="bar-fill" style="height:${x.value?Math.max(5,x.value/max*100):0}%"></div></div><span class="bar-day">${html(x.label)}</span></div>`).join('')}</div></section>
      <section class="panel"><h2>Znalosti</h2><p class="subtle">Aktuální směr: <strong>${dirLabel()}</strong></p>
      <div class="meter-line"><div class="top"><span>Zvládnutá slovíčka</span><span>${c.mastered} / ${WORDS.length}</span></div><div class="progress-track"><div class="progress-fill" style="width:${c.mastered/WORDS.length*100}%"></div></div></div>
      <div class="meter-line"><div class="top"><span>Úspěšnost odpovědí</span><span>${pct} %</span></div><div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div></div>
      <p class="subtle" style="margin-top:21px">${successes+errors?`${successes}× „Umím“ · ${errors}× „Ještě neumím“`:'Zatím žádné vyhodnocené odpovědi.'}</p>
      <div class="divider"></div>${selectorHtml()}</section></div>
      <section class="panel" style="margin-top:19px"><h2>Uložení a záloha</h2><p class="subtle">Pokrok se ukládá automaticky pouze v tomto prohlížeči na tomto zařízení. Nesynchronizuje se mezi počítačem a telefonem. Při anonymním prohlížení nebo vymazání dat webu se může ztratit. Můžete si ho stáhnout a později znovu načíst.</p>
      <div class="settings-actions"><button id="export" class="btn btn-secondary" type="button">↓ Stáhnout zálohu</button><button id="import" class="btn btn-outline" type="button">↑ Načíst zálohu</button><button id="reset" class="btn btn-outline" type="button">Vymazat pokrok</button><input type="file" id="import-file" class="file-input" accept=".json,application/json"></div>${!canSave?'<div class="warning">Pozor: tento prohlížeč nyní nedovoluje trvalé uložení dat. Stáhněte si zálohu.</div>':''}</section>`}
    function vocab(){const c=counts();const q=query.trim().toLocaleLowerCase('cs-CZ');const ws=WORDS.filter(w=>(!q||(w.es+' '+w.cs).toLocaleLowerCase('cs-CZ').includes(q))&&(wordFilter==='all'||cardStatus(w)===wordFilter));return `${commonHeader()}<div class="section-head"><div><h1>Slovníček</h1><p class="lead">${WORDS.length} slovíček z fotografie učebnice. Stav se zobrazuje pro vybraný okruh a směr ${dirLabel().toLocaleLowerCase('cs-CZ')}.</p></div></div>
      ${lessonPicker()}<div class="toolbar"><input id="search" class="search" type="search" autocomplete="off" placeholder="Hledat španělsky nebo česky..." value="${html(query)}" aria-label="Hledat slovíčko"><select id="status-filter" class="search" style="flex:0 1 190px" aria-label="Filtrovat podle stavu"><option value="all" ${wordFilter==='all'?'selected':''}>Všechna (${WORDS.length})</option><option value="new" ${wordFilter==='new'?'selected':''}>Nová (${c.newCount})</option><option value="learning" ${wordFilter==='learning'?'selected':''}>V učení (${c.learning})</option><option value="mastered" ${wordFilter==='mastered'?'selected':''}>Zvládnutá (${c.mastered})</option></select></div>

    function vocabRows(ws){return ws.length?ws.map(w=>{const s=cardStatus(w);const c=rawCard(w);const names={new:'Nové',learning:'Učím se',mastered:'Zvládnuté'};return `<div class="vocab-row"><div class="vocab-word" lang="es">${html(w.es)}<small>${c.seen?`Úspěšně ${c.right||0}×`:'Zatím neprocvičeno'}</small></div><div class="vocab-trans">${html(w.cs)}</div><span class="status ${s}">${names[s]}</span><button class="row-btn" data-single="${w.id}" type="button" aria-label="Procvičit ${html(w.es)}">Procvičit</button></div>`}).join(''):'<div class="panel"><p class="subtle">Žádná odpovídající slovíčka.</p></div>'}
    function exportData(){const b=new Blob([JSON.stringify({type:'spanelstina-hola-progress',exportedAt:new Date().toISOString(),data:state},null,2)],{type:'application/json;charset=utf-8'});const url=URL.createObjectURL(b);const a=document.createElement('a');a.href=url;a.download='spanelstina-lekce1-pokrok-'+getLocalDay()+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);showToast('Záloha byla připravena ke stažení.')}
    async function importData(file){if(!file)return;try{if(file.size>2_000_000)throw Error('Soubor je příliš velký.');const raw=JSON.parse(await file.text());if(raw?.type!=='spanelstina-hola-progress'||!raw.data||raw.data.version!==1||!raw.data.cards||!raw.data.daily)throw Error('Tohle není platná záloha této aplikace.');if(!confirm('Načíst zálohu a přepsat současný pokrok v tomto prohlížeči?'))return;state=parseState(JSON.stringify(raw.data));persist();render();showToast('Pokrok byl obnoven ze zálohy.')}catch(e){showToast(e.message||'Zálohu se nepodařilo načíst.')}}
    function render(){document.querySelectorAll('nav [data-tab]').forEach(b=>{if(b.dataset.tab===tab)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});root.innerHTML=tab==='progress'?progress():tab==='words'?vocab():home()}
    document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;

      if(b.dataset.single){startSession('custom',[b.dataset.single]);return}
      switch(b.id){case 'start':startSession();break;case 'flashcard':case 'reveal':if(session&&!session.revealed){session.revealed=true;render()}break;case 'miss':rate(false);break;case 'know':rate(true);break;case 'sound':speak();break;case 'voice-test':playSpanish('Hola. Buenos días. ¿Cómo estás?');break;case 'end':session=null;render();break;case 'restart':session=null;startSession('all');break;case 'export':exportData();break;case 'import':document.getElementById('import-file')?.click();break;case 'reset':if(confirm('Opravdu chcete vymazat veškerý pokrok v této aplikaci? Tuto akci nelze vrátit.')){state=deepCopy(INITIAL);persist();render();showToast('Pokrok byl vymazán.')}break;}
    });
    document.addEventListener('input',e=>{if(e.target.id==='search'){query=e.target.value;const q=query.trim().toLocaleLowerCase('cs-CZ');const ws=WORDS.filter(w=>(!q||(w.es+' '+w.cs).toLocaleLowerCase('cs-CZ').includes(q))&&(wordFilter==='all'||cardStatus(w)===wordFilter));document.getElementById('vocab-rows').innerHTML=vocabRows(ws)}});
    document.addEventListener('change',e=>{if(e.target.id==='status-filter'){wordFilter=e.target.value;render();document.getElementById('search')?.focus()}if(e.target.id==='import-file'){importData(e.target.files[0]);e.target.value=''}});
    document.addEventListener('keydown',e=>{if(tab!=='home'||!session||session.done||e.altKey||e.ctrlKey||e.metaKey)return;const tag=document.activeElement?.tagName;if(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT')return;if((e.code==='Space'||e.key===' ')&&!session.revealed){e.preventDefault();session.revealed=true;render();return}if(session.revealed&&e.key==='1'){rate(false);return}if(session.revealed&&e.key==='2'){rate(true);return}});
    render();
    if('serviceWorker' in navigator && location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
  </script>
</body>
</html>
