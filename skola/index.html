<script>
(()=>{
const EMPTY={"schemaVersion":1,"source":{"label":"Vlastní školní přehled","asOf":"","note":""},"subjects":[],"tasks":[],"history":[]};
const GRADES=["Úplně osvojeno","Téměř osvojeno","Částečně osvojeno","Ještě neosvojeno"];
const STATUSES=['todo','clarify','in_progress','submitted','accepted'];
function validateState(s){
 if(!s||s.schemaVersion!==1||!Array.isArray(s.subjects)||!Array.isArray(s.tasks)||!Array.isArray(s.history))return "Soubor nemá podporovaný formát přehledu.";
 if(s.subjects.length>100||s.tasks.length>1000||s.history.length>5000)return "Přehled obsahuje příliš mnoho záznamů.";
 const subjectIds=new Set(), taskIds=new Set();
 for(const sub of s.subjects){
  if(!sub||typeof sub.id!=="string"||!sub.id||subjectIds.has(sub.id)||typeof sub.name!=="string"||!sub.name.trim()||!Array.isArray(sub.quarter)||!Array.isArray(sub.evidence))return "Neplatný nebo duplicitní předmět.";
  subjectIds.add(sub.id);
  const areas=new Set();
  for(const q of sub.quarter){
   if(!q||typeof q.area!=="string"||!q.area.trim()||areas.has(q.area)||!GRADES.includes(q.grade))return "Neplatné hodnocení oblasti.";
   areas.add(q.area);
  }
 }
 for(const t of s.tasks){
  if(!t||typeof t.id!=="string"||!t.id||taskIds.has(t.id)||!subjectIds.has(t.subjectId))return "Neplatný úkol nebo předmět úkolu.";
  taskIds.add(t.id);
  if(!["homework","learning"].includes(t.category)||!STATUSES.includes(t.status)||!["high","normal","low"].includes(t.priority))return "Neplatná kategorie, stav nebo priorita.";
  if(typeof t.title!=="string"||!t.title.trim()||typeof t.notes!=="string"||!Array.isArray(t.evaluations))return "Úkol nemá povinné údaje.";
  if(t.title.length>500||t.notes.length>20000||t.evaluations.length>200)return "Úkol obsahuje příliš dlouhý text nebo mnoho hodnocení.";
  for(const e of t.evaluations){
   if(!e||!GRADES.includes(e.grade)||typeof e.date!=="string"||!/^\d{4}-\d{2}-\d{2}$/.test(e.date))return "Hodnocení potřebuje datum a platný stupeň.";
  }
  for(const key of ["dueDate","submittedDate"])if(t[key] && !/^\d{4}-\d{2}-\d{2}$/.test(t[key]))return "Datum musí být ve formátu RRRR-MM-DD.";
 }
 return null;
}
function validate(s){
 const error=validateState(s);if(error)return error;
 if(!s.source||typeof s.source.label!=='string'||typeof s.source.asOf!=='string')return 'Chybí zdroj dat.';
 for(const sub of s.subjects){if(sub.evidence.some(e=>!e||typeof e.title!=='string')||typeof sub.summary!=='string')return 'Neplatné podklady předmětu.';}
 for(const t of s.tasks){if(!Array.isArray(t.relatedIds)||t.relatedIds.some(id=>typeof id!=='string'))return 'Neplatné související úkoly.';}
 if(s.history.some(h=>!h||typeof h.date!=='string'||typeof h.label!=='string'))return 'Neplatná historie změn.';
 return null;
}
const KEY='school-tracker-pages-v1:'+new URL('.',window.location.href).pathname;
const clone=x=>JSON.parse(JSON.stringify(x));
const response=(value,status=200)=>new Response(JSON.stringify(value),{status,headers:{'Content-Type':'application/json'}});
const fresh=()=>({state:clone(EMPTY),revision:1,updatedAt:new Date().toISOString()});
let memory=null;
function read(){
 const raw=localStorage.getItem(KEY);
 if(!raw)return memory||fresh();
 const record=JSON.parse(raw);
 if(validate(record.state)||!Number.isSafeInteger(record.revision)||record.revision<1)throw new Error('Neplatná uložená data');
 return record;
}
window.__sofieOffline=true;
window.__schoolPages=true;
window.__schoolValidateState=validate;
window.fetch=async function(input,options={}){
 const address=typeof input==='string'?input:input.url;
 if(address!=='/api/state')throw new Error('Tato aplikace neposílá data na síť.');
 const method=(options.method||'GET').toUpperCase();
 if(method==='GET'){
  try{const record=read();localStorage.setItem(KEY,JSON.stringify(record));memory=record;window.__sofieStorageAvailable=true;return response(record);}
  catch(e){window.__sofieStorageAvailable=false;return response(memory||fresh());}
 }
 if(method==='PUT'){
  let body;try{body=JSON.parse(options.body);}catch{return response({error:'Neplatná data.'},400);}
  const error=validate(body.state);if(error)return response({error},400);
  try{
   const current=read();
   if(body.revision!==current.revision)return response({error:'Data změnilo jiné okno. Exportujte rozpracovanou verzi a načtěte aktuální přehled.'},409);
   const next={state:clone(body.state),revision:current.revision+1,updatedAt:new Date().toISOString()};
   localStorage.setItem(KEY,JSON.stringify(next));
   const check=JSON.parse(localStorage.getItem(KEY));if(check.revision!==next.revision)throw new Error('Zápis se nepotvrdil');
   memory=next;window.__sofieStorageAvailable=true;return response(next);
  }catch(e){window.__sofieStorageAvailable=false;return response({error:'Prohlížeč data neuložil. Exportujte rozpracovanou verzi; zkontrolujte povolení ukládání nebo platnost dříve uložených dat.'},503);}
 }
 return response({error:'Nepodporovaná akce.'},405);
};
})();</script>

@media(max-width:780px){.shell{display:block}.sidebar{height:auto;position:relative;padding:16px}.brand{padding:0 3px 16px}.brand-mark{height:34px;width:34px;border-radius:10px;font-size:20px}.brand strong{font-size:16px}.brand small{font-size:10px}.nav-label,.sidebar-foot{display:none}.nav{flex-direction:row;overflow:auto;gap:5px}.nav button{padding:9px 11px;font-size:11px;white-space:nowrap;gap:7px}.nav button svg{width:16px}.nav-count{display:none}.main{padding:0 18px 30px}.topbar{height:62px}.save-state{font-size:10px;margin-right:2px}.top-actions{gap:3px}.top-actions .button{padding:7px}.breadcrumb{font-size:10px}.top-actions .print-button{display:none}.page-heading{margin:25px 0 20px}.page-heading h1{font-size:25px}.page-heading p{font-size:12px}.page-heading .button{white-space:nowrap;padding:9px;margin-top:22px}.page-heading .button .label{display:none}.stats{grid-template-columns:repeat(2,1fr);gap:11px;margin-bottom:18px}.stat{padding:17px 16px}.stat-title{font-size:11px}.stat-number{font-size:27px}.stat-label{font-size:10px}.overview-grid{gap:17px}.overview-grid>div:last-child{display:block}.focus-note{margin-top:17px}.filters{grid-template-columns:1fr 1fr;gap:9px}.filters .search-wrap{grid-column:1/-1}.task-grid,.subject-grid{grid-template-columns:1fr}.task-card{padding:18px}.panel-head,.panel-body{padding-left:18px;padding-right:18px}.task-row,.subject-mini{padding-left:18px;padding-right:18px}.modal-header{padding:20px}.modal-body{padding:20px}.modal-footer{padding:15px 20px}.modal-header h2{font-size:18px}.modal-footer .small{display:none}.modal-footer{justify-content:flex-end}.form-grid{gap:12px}.history-event{gap:10px;padding:16px}.history-event .time{flex-basis:82px;font-size:10px}.history-event>span:last-child{font-size:12px}.toast{left:18px;right:18px;bottom:18px}.quarter-editor{grid-template-columns:1fr}.source-note{font-size:10px}}

<body>
<div class="shell">
<aside class="sidebar">
<div class="brand"><div class="brand-mark">Š</div><div><strong>Škola</strong><small>ŠKOLA V PŘEHLEDU</small></div></div>
<div class="nav-label">PRACOVNÍ PŘEHLED</div>
<nav class="nav" id="nav" aria-label="Hlavní nabídka"></nav>
<div class="sidebar-foot"><div class="goal-card"><div class="small">Společný cíl</div><strong>Nejméně Částečně osvojeno</strong><p>Po malých krocích. S přehledem o tom, co už je hotové.</p></div><p>Data uložená v tomto prohlížeči<br>Nezapomeňte na export zálohy</p></div>
</aside>
<main class="main">
<header class="topbar"><div class="breadcrumb">Školní přehled <span>/ <span id="crumb">Přehled</span></span></div><div class="top-actions"><span id="saveState" class="save-state" aria-live="polite"><i class="dot busy"></i>Načítám…</span><button class="button" id="exportBtn" title="Stáhnout zálohu dat" disabled><span id="exportIcon"></span><span class="label">Export</span></button><button class="button" id="importBtn" title="Obnovit data ze zálohy" disabled><span id="importIcon"></span><span class="label">Import</span></button><button class="button icon-button print-button" id="printBtn" title="Vytisknout zobrazený přehled" aria-label="Vytisknout zobrazený přehled"><span id="printIcon"></span></button></div></header>
<div id="globalBanner" role="alert"></div>
<div id="content"><div class="loading"><div class="spinner"></div>Načítám školní přehled…</div></div>
</main>
</div>
<dialog id="modal" aria-labelledby="modalTitle"></dialog>
<input type="file" id="importFile" accept=".json,application/json" hidden>
<div id="toast" class="toast" role="status"></div>
<script>
'use strict';
const ICONS={
home:'<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>',
tasks:'<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V2h6v2M9 10h6M9 14h6M9 18h3"/>',
learn:'<path d="M12 7c-3-3-7-3-10-2v15c3-1 7-1 10 2 3-3 7-3 10-2V5c-3-1-7-1-10 2Z"/><path d="M12 7v15"/>',
subjects:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',
history:'<path d="M3 11a9 9 0 1 1 2.6 7M3 3v8h8M12 7v5l3 2"/>',
download:'<path d="M12 3v12m-5-5 5 5 5-5M5 16v5h14v-5"/>',
upload:'<path d="M12 16V4m-5 5 5-5 5 5M5 16v5h14v-5"/>',
print:'<path d="M6 9V3h12v6M6 18H3V9h18v9h-3M6 14h12v7H6zM17 12h1"/>',
plus:'<path d="M12 5v14M5 12h14"/>',
arrow:'<path d="m9 5 7 7-7 7"/>',
check:'<path d="m5 12 4 4L19 6"/>',
close:'<path d="m6 6 12 12M6 18 18 6"/>',
search:'<circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/>',
target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',
clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7v1"/>',
leaf:'<path d="M20 3C8 2 2 9 6 16s14 3 14-13Z"/><path d="M4 21 15 10"/>',
refresh:'<path d="M20 7a9 9 0 0 0-15-3L2 7m0-5v5h5M4 17a9 9 0 0 0 15 3l3-3m0 5v-5h-5"/>'
};
function icon(name){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(ICONS[name]||ICONS.info)+'</svg>'}
const grades=['Úplně osvojeno','Téměř osvojeno','Částečně osvojeno','Ještě neosvojeno'];
const gradeColors=['teal','teal','blue','rose'];
const statusNames={todo:'K doplnění',clarify:'Upřesnit zadání',in_progress:'Rozpracováno',submitted:'Čeká na učitele',accepted:'Potvrzeno učitelem'};
const priorities={high:'Nejdřív',normal:'Postupně',low:'Udržovat'};
const statusColors={todo:'gray',clarify:'amber',in_progress:'blue',submitted:'amber',accepted:'teal'};
const navItems=[['overview','home','Přehled'],['homework','tasks','K odevzdání'],['learning','learn','K doučení'],['subjects','subjects','Předměty'],['history','history','Historie']];
let state=null,revision=null,updatedAt='',view='overview',search='',subjectFilter='',statusFilter='',saving=false,pendingState=null,conflict=false,dialogDirty=false;
const $=id=>document.getElementById(id);
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=value=>JSON.parse(JSON.stringify(value));
const uid=prefix=>(prefix||'evt')+'-'+(globalThis.crypto?.randomUUID?.()||Date.now().toString(36)+Math.random().toString(36).slice(2));
const today=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Prague',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
function dateFormat(value,withTime=false){if(!value)return 'Bez termínu';const d=new Date(value.length===10?value+'T12:00:00':value);return Number.isNaN(+d)?value:new Intl.DateTimeFormat('cs-CZ',{day:'numeric',month:'numeric',year:'numeric',...(withTime?{hour:'2-digit',minute:'2-digit',timeZone:'Europe/Prague'}:{})}).format(d)}
function subj(id){return state?.subjects.find(s=>s.id===id)}
function gradeTag(g){const i=grades.indexOf(g);return '<span class="tag '+(gradeColors[i]||'gray')+'">'+esc(g||'Bez hodnocení')+'</span>'}
function statusText(t){if(t.status==='todo'&&t.category==='learning')return 'K procvičení';if(t.status==='submitted')return t.category==='learning'?'Ověření domluveno':'Odevzdáno';return statusNames[t.status]||t.status}
function statusTag(t){return '<span class="tag '+(statusColors[t.status]||'gray')+'">'+(t.status==='accepted'?icon('check'):'')+esc(statusText(t))+'</span>'}
function sourceNote(){const offline=window.__sofieOffline===true?'<br><strong>Ukládání v prohlížeči:</strong> '+(window.__sofieStorageAvailable===false?'Trvalé ukládání není dostupné. Změny zůstávají jen do zavření tohoto okna; pravidelně použijte Export.':'Data se ukládají v tomto prohlížeči. Změny se mezi zařízeními samy nesynchronizují. Pro zálohu a přenos použijte Export a Import.') : '';return '<div class="source-note"><strong>'+esc(state.source.label)+'</strong> · výchozí podklady '+esc(dateFormat(state.source.asOf))+'.<br>Nové údaje se zapisují ručně. Přehled není automaticky propojen s EduPage. Hodnocení jednotlivých prací nemění čtvrtletní oblasti.'+offline+'</div>'}
function setSaveStatus(text,type='ok'){if(text==='Uloženo'&&window.__sofieOffline===true&&window.__sofieStorageAvailable===false){text='Pouze v tomto okně';type='error'}$('saveState').innerHTML='<i class="dot '+(type==='error'?'error':type==='busy'?'busy':'')+'"></i>'+esc(text)}
function showToast(message){$('toast').innerHTML=icon('check')+esc(message);clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>$('toast').textContent='',3800)}
function renderNav(){ $('nav').innerHTML=navItems.map(([id,ico,label])=>'<button type="button" data-view="'+id+'" class="'+(view===id?'active':'')+'" '+(view===id?'aria-current="page"':'')+'>'+icon(ico)+'<span>'+label+'</span>'+((id==='homework'||id==='learning')&&state?'<span class="nav-count">'+state.tasks.filter(t=>t.category===id&&t.status!=='accepted').length+'</span>':'')+'</button>').join('');$('crumb').textContent=navItems.find(n=>n[0]===view)?.[2]||'Přehled'}
function heading(title,description,add=false){return '<div class="page-heading"><div><div class="eyebrow">ŠKOLA V PŘEHLEDU</div><h1>'+title+'</h1><p>'+description+'</p></div>'+(add?'<button class="button primary" data-action="add">'+icon('plus')+'<span class="label">Přidat úkol</span></button>':'')+'</div>'}
function sortTasks(tasks){const rank={high:0,normal:1,low:2};return tasks.slice().sort((a,b)=>(a.status==='accepted')-(b.status==='accepted')||(rank[a.priority]??1)-(rank[b.priority]??1)||(a.dueDate||'9999').localeCompare(b.dueDate||'9999'))}
function taskRow(t){return '<button class="task-row" data-task="'+esc(t.id)+'"><span class="task-icon">'+icon(t.category==='homework'?'tasks':'learn')+'</span><span class="task-info"><strong>'+esc(t.title)+'</strong><span class="task-meta"><span>'+esc(subj(t.subjectId)?.name||t.subjectId)+'</span><span>·</span><span>'+esc(t.category==='homework'?'K odevzdání':'K doučení')+'</span>'+statusTag(t)+'</span></span><span class="arrow">'+icon('arrow')+'</span></button>'}
function quarterSummary(s){if(s.exempt)return {label:'Trvale uvolněna',color:'gray',detail:'Bez úkolů k doplnění.'};const bad=s.quarter.filter(q=>q.grade==='Ještě neosvojeno');if(bad.length)return {label:'Potřebuje zlepšit',color:'rose',detail:bad.map(q=>q.area).join(' · ')};if(s.quarter.length)return {label:'Cíl v evidovaných oblastech',color:'teal',detail:s.quarter.length+' '+(s.quarter.length===1?'hodnocená oblast':'hodnocené oblasti')};return {label:'Čtvrtletí neuvedeno',color:'gray',detail:'K dispozici jsou jednotlivé výsledky.'}}
function renderOverview(){
const open=state.tasks.filter(t=>t.status!=='accepted'),done=state.tasks.length-open.length,unclear=open.filter(t=>t.needsClarification||t.status==='clarify').length;
const badAreas=state.subjects.filter(s=>!s.exempt).reduce((n,s)=>n+s.quarter.filter(q=>q.grade==='Ještě neosvojeno').length,0);
const risks=state.subjects.filter(s=>!s.exempt&&(s.quarter.some(q=>q.grade==='Ještě neosvojeno')||(!s.quarter.length&&s.evidence.some(e=>e.grade==='Ještě neosvojeno'))));
const selected=[...sortTasks(open.filter(t=>t.category==='homework')).slice(0,3),...sortTasks(open.filter(t=>t.category==='learning')).slice(0,3)];
const next=sortTasks([...selected,...sortTasks(open).filter(t=>!selected.some(a=>a.id===t.id)).slice(0,6-selected.length)]),pct=state.tasks.length?Math.round(done/state.tasks.length*100):0;
return heading('Každý krok se počítá.','Úkoly, učení a hodnocení na jednom místě. Vyberte malý další krok a po dokončení zaznamenejte výsledek.',true)+
'<div class="stats"><div class="stat"><span class="stat-icon">'+icon('tasks')+'</span><div class="stat-title">Otevřené položky</div><div class="stat-number">'+open.length+'</div><div class="stat-label">včetně kroků k upřesnění</div></div>'+
'<div class="stat"><span class="stat-icon">'+icon('info')+'</span><div class="stat-title">K upřesnění</div><div class="stat-number">'+unclear+'</div><div class="stat-label">zadání nebo podmínek</div></div>'+
'<div class="stat"><span class="stat-icon">'+icon('target')+'</span><div class="stat-title">Oblasti pod cílem</div><div class="stat-number">'+badAreas+'</div><div class="stat-label">čtvrtletně Ještě neosvojeno</div></div>'+
'<div class="stat"><span class="stat-icon">'+icon('check')+'</span><div class="stat-title">Potvrzené úkoly</div><div class="stat-number">'+done+'<span style="font-size:14px;font-weight:400;color:var(--muted)"> / '+state.tasks.length+'</span></div><div class="stat-label">přijato nebo ověřeno učitelem</div><div class="bar"><span style="width:'+pct+'%"></span></div></div></div>'+
'<div class="overview-grid"><section class="panel"><div class="panel-head"><div><h2>Na co se zaměřit nejdřív</h2><p>Otevřené úkoly podle priority a termínu.</p></div><span class="tag teal">DALŠÍ KROKY</span></div>'+ (next.length?next.map(taskRow).join(''):'<div class="empty">'+icon('check')+'<strong>Všechny úkoly mají potvrzení.</strong>Nové zadání můžete kdykoli přidat.</div>')+'</section><div><section class="panel"><div class="panel-head"><div><h2>Předměty, které potřebují pozornost</h2><p>Čtvrtletní oblasti a známé slabší výsledky.</p></div></div>'+ (risks.length?risks.map(s=>{const q=quarterSummary(s);return '<button class="subject-mini" data-subject="'+esc(s.id)+'"><span><strong>'+esc(s.name)+'</strong><small>'+esc(q.detail)+'</small></span><span class="tag '+q.color+'">'+(s.quarter.length?'Zlepšit':'Upřesnit')+'</span></button>'}).join(''):'<div class="panel-body muted small">V evidovaných čtvrtletních oblastech není Ještě neosvojeno.</div>')+'</section><div class="focus-note">'+icon('leaf')+'<div><strong>Jedna práce po druhé</strong><p>Pro začátek zvolte krátký úkol k odevzdání a jeden malý okruh k procvičení. Rozsah přizpůsobte aktuálním možnostem. Seznam zahrnuje i podmíněné kroky; počet položek není počtem nutných opravných testů.</p></div></div></div></div>'+sourceNote();
}
function filtersHtml(){return '<div class="filters"><label class="search-wrap"><span class="sr-only">Hledat úkol</span>'+icon('search')+'<input class="field" id="search" placeholder="Hledat v úkolech…" value="'+esc(search)+'"></label><label><span class="sr-only">Předmět</span><select id="subjectFilter"><option value="">Všechny předměty</option>'+state.subjects.filter(s=>!s.exempt).map(s=>'<option value="'+esc(s.id)+'" '+(subjectFilter===s.id?'selected':'')+'>'+esc(s.name)+'</option>').join('')+'</select></label><label><span class="sr-only">Stav</span><select id="statusFilter"><option value="">Všechny stavy</option><option value="open" '+(statusFilter==='open'?'selected':'')+'>Jen otevřené</option>'+Object.entries(statusNames).map(([id,label])=>'<option value="'+id+'" '+(statusFilter===id?'selected':'')+'>'+label+'</option>').join('')+'</select></label></div>'}
function filteredTasks(){const q=search.toLocaleLowerCase('cs');return sortTasks(state.tasks.filter(t=>t.category===view&&(!subjectFilter||t.subjectId===subjectFilter)&&(!statusFilter||(statusFilter==='open'?t.status!=='accepted':t.status===statusFilter))&&(!q||[t.title,t.description,t.notes,subj(t.subjectId)?.name].join(' ').toLocaleLowerCase('cs').includes(q))))}
function taskCard(t){const last=t.evaluations[t.evaluations.length-1];return '<button class="task-card '+(t.status==='accepted'?'accepted':'')+'" data-task="'+esc(t.id)+'"><div class="task-card-head"><span class="task-card-subject">'+esc(subj(t.subjectId)?.name||t.subjectId)+'</span><span class="tag '+(t.priority==='high'?'amber':'gray')+'">'+esc(priorities[t.priority]||'Postupně')+'</span></div><h3>'+esc(t.title)+'</h3><div class="task-card-desc">'+esc(t.description)+'</div>'+(last?'<div class="last-grade">Poslední výsledek '+gradeTag(last.grade)+'</div>':'')+'<div class="task-card-bottom">'+statusTag(t)+'<span class="small muted">'+(t.dueDate?'Termín '+esc(dateFormat(t.dueDate)):t.needsClarification?'Podmínky k ověření':'Termín nedohodnut')+'</span></div></button>'}
function taskResultsHtml(){const rows=filteredTasks();return '<div class="results-label">'+rows.length+' '+(rows.length===1?'položka':rows.length>1&&rows.length<5?'položky':'položek')+' · kliknutím otevřete detail</div><div class="task-grid">'+(rows.length?rows.map(taskCard).join(''):'<div class="empty">'+icon('search')+'<strong>Tomuto výběru nic neodpovídá.</strong>Zkuste změnit filtr nebo přidat úkol.</div>')+'</div>'}
function renderTasks(){return heading(view==='homework'?'Domácí úkoly k odevzdání':'Znalosti k doučení',view==='homework'?'Dopracovat, odevzdat a zaznamenat zpětnou vazbu učitele.':'Procvičit konkrétní látku a domluvit způsob ověření. Samotné doučení ještě nemění hodnocení.',true)+filtersHtml()+'<div id="taskResults">'+taskResultsHtml()+'</div>'+sourceNote()}
function renderSubjects(){return heading('Předměty a jejich hodnocení','Čtvrtletní oblasti se aktualizují samostatně podle učitele. Výsledky jednotlivých úkolů jsou uvedené v jejich detailech.')+'<div class="subject-grid">'+state.subjects.map(s=>{const q=quarterSummary(s);const open=state.tasks.filter(t=>t.subjectId===s.id&&t.status!=='accepted').length;return '<section class="subject-card"><div class="subject-card-top"><div><h2>'+esc(s.name)+'</h2><p>'+esc(s.teacher||'Vyučující neuveden')+'</p></div><span class="tag '+q.color+'">'+esc(q.label)+'</span></div><p class="summary">'+esc(s.summary)+'</p><div class="quarter-list">'+(s.quarter.length?s.quarter.map(a=>'<div class="quarter-line"><span>'+esc(a.area)+'</span>'+gradeTag(a.grade)+'</div>').join(''):'<span class="small muted">'+(s.exempt?'Z plánu doplňování vyřazeno.':'Samostatné čtvrtletní hodnocení nebylo v podkladech uvedeno.')+'</span>')+'</div><div class="subject-card-footer"><span class="small muted">'+(s.exempt?'Trvalé uvolnění':open+' otevřených úkolů')+'</span><button class="button subtle" data-subject="'+esc(s.id)+'">'+(s.exempt?'Zobrazit':'Detail a hodnocení')+icon('arrow')+'</button></div></section>'}).join('')+'</div>'+sourceNote()}
function renderHistory(){const history=state.history.slice().reverse();return heading('Historie změn','Záznam o doplnění prací, výsledcích ověření a změnách čtvrtletního hodnocení.')+(history.length?'<div class="history-list">'+history.map(h=>'<div class="history-event">'+icon('history')+'<span class="time">'+esc(dateFormat(h.date,true))+'</span><span>'+esc(h.label)+'</span></div>').join('')+'</div>':'<div class="empty">'+icon('history')+'<strong>Tady se objeví první změna.</strong>Výchozí přehled je připravený z podkladů EduPage. Nové zápisy se do historie přidají při uložení.</div>')+sourceNote()}

 switch(action.dataset.action){
 case'importData':$('importBtn').click();break;
 case'add':openTask(null,true);break;
 case'close':closeModal();break;
 case'reload':loadState();break;
 case'exportCurrent':exportData(false);break;
 case'exportPending':exportData(true);break;
 case'reloadConfirmed':
 if(confirm('Načíst aktuální uložená data? Rozpracovaná verze tím bude opuštěna. Předtím si ji můžete exportovat.')){dialogDirty=false;closeModal(true);await loadState()}break;
 }
});
$('content').addEventListener('input',e=>{if(e.target.id==='search'){search=e.target.value;$('taskResults').innerHTML=taskResultsHtml()}});
$('content').addEventListener('change',e=>{if(e.target.id==='subjectFilter'){subjectFilter=e.target.value;$('taskResults').innerHTML=taskResultsHtml()}if(e.target.id==='statusFilter'){statusFilter=e.target.value;$('taskResults').innerHTML=taskResultsHtml()}});
$('modal').addEventListener('input',()=>{dialogDirty=true;setSaveStatus('Rozpracované změny','busy')});
$('modal').addEventListener('change',e=>{dialogDirty=true;setSaveStatus('Rozpracované změny','busy');if(e.target.id==='taskCategory'){const option=$('taskStatus')?.querySelector('option[value="submitted"]');if(option)option.textContent=e.target.value==='learning'?'Ověření domluveno':'Odevzdáno'}});
$('modal').addEventListener('cancel',e=>{e.preventDefault();closeModal()});
$('modal').addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='taskForm')saveTask(e.target);if(e.target.id==='subjectForm')saveSubject(e.target);if(e.target.id==='importForm')saveImport(e.target)});
$('exportBtn').addEventListener('click',()=>exportData(Boolean(pendingState)));
$('importBtn').addEventListener('click',()=>{if(conflict){showToast('Nejprve vyřešte konflikt uložené a rozpracované verze.');return}$('importFile').value='';$('importFile').click()});
$('importFile').addEventListener('change',e=>prepareImport(e.target.files?.[0]));
$('printBtn').addEventListener('click',()=>window.print());
window.addEventListener('beforeunload',e=>{if(dialogDirty||pendingState){e.preventDefault();e.returnValue=''}});
$('exportIcon').innerHTML=icon('download');$('importIcon').innerHTML=icon('upload');$('printIcon').innerHTML=icon('print');
renderNav();loadState();
</script>
</body>
</html>
